        .dot-2 { animation: blink 1.2s ease infinite 0.2s; }

Twoje specjalizacje:

    key:      <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,

    brain:    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636-.707.707M21 12h-1M4 12H3m3.343-5.657-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>,
};

/* ─── formatMessage: simple markdown → JSX ─── */
function FormatMsg({ text }) {
    const lines = text.split('\n');
    return (
        <div className="space-y-1">
            {lines.map((line, i) => {
                if (line.startsWith('• ') || line.startsWith('- ')) {
                    return <div key={i} className="flex items-start space-x-2"><span className="text-purple-400 mt-0.5">•</span><span>{line.slice(2)}</span></div>;
                }
                if (line.startsWith('**') && line.endsWith('**')) {
                    return <p key={i} className="font-semibold text-white">{line.slice(2,-2)}</p>;
                }
                if (line.trim() === '') return <div key={i} className="h-1"></div>;
                return <p key={i}>{line}</p>;
            })}
        </div>
    );
}

/* ════════════════════════════════════════════
   Main App
════════════════════════════════════════════ */
function OpenHumanAgent() {
    /* Auth */
    const [user, setUser]   = useState(S.get('oh_user', null));
    const [showLogin, setShowLogin] = useState(!S.get('oh_user', null));

    /* Config */
    const [geminiKey, setGeminiKey]         = useState(S.get('oh_gemini_key', ''));
    const [googleClientId, setGoogleClientId] = useState(S.get('oh_gci', ''));
    const [showSettings, setShowSettings]   = useState(false);

    /* Layout */
    const [activePanel, setActivePanel]   = useState('browser');
    const [sidebarTab, setSidebarTab]     = useState('bookmarks');

    /* Browser state */
    const [tabs, setTabs]             = useState([{ id: 1, title: 'Nowa karta', url: 'https://www.google.com', favicon: '🌐' }]);
    const [activeTabId, setActiveTabId] = useState(1);
    const [urlInput, setUrlInput]     = useState('https://www.google.com');
    const [currentUrl, setCurrentUrl] = useState('https://www.google.com');
    const [iframeKey, setIframeKey]   = useState(0);
    const [loading, setLoading]       = useState(false);
    const [blocked, setBlocked]       = useState(false);
    const [bookmarks, setBookmarks]   = useState(S.get('oh_bookmarks', DEFAULT_BOOKMARKS));
    const [history, setHistory]       = useState(S.get('oh_history', []));
    const iframeRef = useRef(null);
    const iframeTimeoutRef = useRef(null);

    /* AI state */
    const [messages, setMessages]   = useState([
        { role: 'assistant', content: 'Cześć! Jestem Twoim OpenHuman Agent 🤖\n\nPomagam Ci w nawigacji po internecie, odpowiadam na pytania o biohaking, neurohaking i optymalizację zdrowia.\n\nCo chcesz dziś zbadać lub osiągnąć?' }
    ]);
    const [userInput, setUserInput] = useState('');
    const [thinking, setThinking]   = useState(false);
    const [copied, setCopied]       = useState(null);
    const messagesEnd = useRef(null);

    /* Persist */
    useEffect(() => { S.set('oh_bookmarks', bookmarks); }, [bookmarks]);
    useEffect(() => { S.set('oh_history', history.slice(0, 150)); }, [history]);
    useEffect(() => { S.set('oh_user', user); }, [user]);
    useEffect(() => { messagesEnd.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, thinking]);

    /* Google Sign-In setup — only when Client ID is explicitly configured */
    useEffect(() => {
        if (!googleClientId || !showLogin) return;
        const init = () => {
            if (!window.google?.accounts?.id) return setTimeout(init, 400);
            try {
                window.google.accounts.id.initialize({
                    client_id: googleClientId,
                    callback: onGoogleToken,
                    auto_select: false,   // never auto-sign — user must click
                    cancel_on_tap_outside: true,
                    use_fedcm_for_prompt: false,
                });
                const btn = document.getElementById('g-btn');
                if (btn) window.google.accounts.id.renderButton(btn, { theme: 'filled_black', size: 'large', width: 320 });
            } catch (err) {
                console.warn('Google Sign-In init failed:', err);
            }
        };
        init();
    }, [googleClientId, showLogin]);

    const onGoogleToken = (resp) => {
        try {
            const p = JSON.parse(atob(resp.credential.split('.')[1]));
            const u = { name: p.name, email: p.email, picture: p.picture, sub: p.sub };
            setUser(u); setShowLogin(false);
        } catch (err) {
            console.error('Google token error:', err);
            setGoogleError('Błąd Google Sign-In. Użyj logowania lokalnego poniżej.');
        }
    };

    const [googleError, setGoogleError] = useState('');

    const localLogin = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setUser({ name: fd.get('name') || 'Użytkownik', email: fd.get('email') || 'local@openhuman', picture: null, sub: 'local_' + Date.now() });
        setShowLogin(false);
    };

    const logout = () => { setUser(null); setShowLogin(true); S.set('oh_user', null); window.google?.accounts?.id?.disableAutoSelect?.(); };

    /* ── Browser navigation ── */
    const navigate = useCallback((rawUrl) => {
        let url = rawUrl.trim();
        if (!url) return;
        if (url.startsWith('./') || url.startsWith('/')) { /* relative - ok */ }
        else if (!url.match(/^https?:\/\//)) {
            url = url.includes('.') && !url.includes(' ')
                ? 'https://' + url
                : 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }
        setUrlInput(url);
        setCurrentUrl(url);
        setBlocked(false);
        setLoading(true);
        setIframeKey(k => k + 1);
        setTabs(ts => ts.map(t => t.id === activeTabId ? { ...t, url, title: tryHostname(url) } : t));
        setHistory(h => [{ url, time: Date.now() }, ...h.filter(x => x.url !== url).slice(0, 149)]);
        clearTimeout(iframeTimeoutRef.current);
        iframeTimeoutRef.current = setTimeout(() => { setLoading(false); setBlocked(true); }, 8000);
    }, [activeTabId]);

    const tryHostname = (url) => { try { return new URL(url).hostname; } catch { return url; } };

    const iframeLoaded = () => {
        clearTimeout(iframeTimeoutRef.current);
        setLoading(false);
        try {
            const title = iframeRef.current?.contentDocument?.title;
            if (title) setTabs(ts => ts.map(t => t.id === activeTabId ? { ...t, title } : t));
        } catch {}
    };

    const iframeError = () => {
        clearTimeout(iframeTimeoutRef.current);
        setLoading(false);
        setBlocked(true);
    };

    const urlSubmit = (e) => { e.preventDefault(); navigate(urlInput); };

    const newTab = () => {
        const id = Date.now();
        setTabs(ts => [...ts, { id, title: 'Nowa karta', url: 'https://www.google.com', favicon: '🌐' }]);
        setActiveTabId(id);
        navigate('https://www.google.com');
    };

    const closeTab = (id, e) => {
        e.stopPropagation();
        if (tabs.length === 1) return;
        const next = tabs.filter(t => t.id !== id);
        setTabs(next);
        if (activeTabId === id) {
            const last = next[next.length - 1];
            setActiveTabId(last.id);
            navigate(last.url);
        }
    };

    const switchTab = (t) => { setActiveTabId(t.id); setUrlInput(t.url); setCurrentUrl(t.url); setBlocked(false); setIframeKey(k => k + 1); };

    const addBookmark = () => {
        if (bookmarks.find(b => b.url === currentUrl)) return;
        setBookmarks(bs => [...bs, { id: Date.now(), icon: '🔖', title: tryHostname(currentUrl), url: currentUrl }]);
    };

    const removeBookmark = (id, e) => { e.stopPropagation(); setBookmarks(bs => bs.filter(b => b.id !== id)); };

    /* ── AI chat — działa BEZ klucza (Pollinations.ai) lub z kluczem Gemini ── */
    const sendAI = async () => {
        if (!userInput.trim() || thinking) return;
        const msg = userInput.trim();
        setUserInput('');
        const newMsgs = [...messages, { role: 'user', content: msg }];
        setMessages(newMsgs);
        setThinking(true);

        try {
            const ctx = currentUrl ? `[Użytkownik aktualnie przegląda: ${currentUrl}]\n\n` : '';
            const lastUserMsg = ctx + msg;
            let reply = '';

            if (geminiKey) {
                /* ── Gemini (jeśli klucz ustawiony) ── */
                const geminiContents = newMsgs.slice(0, -1).map(m => ({
                    role: m.role === 'assistant' ? 'model' : 'user',
                    parts: [{ text: m.content }]
                }));
                const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                            contents: [...geminiContents, { role: 'user', parts: [{ text: lastUserMsg }] }],
                            generationConfig: { maxOutputTokens: 2048, temperature: 0.7 },
                            safetySettings: [
                                { category: 'HARM_CATEGORY_HARASSMENT',       threshold: 'BLOCK_NONE' },
                                { category: 'HARM_CATEGORY_HATE_SPEECH',       threshold: 'BLOCK_NONE' },
                                { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
                                { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' },
                            ],
                        }),
                    }
                );
                if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
                const data = await res.json();
                reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(brak odpowiedzi)';

            } else {
                /* ── Pollinations.ai — całkowicie darmowe, bez klucza ── */
                const pollinationsMsgs = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...newMsgs.slice(0, -1),
                    { role: 'user', content: lastUserMsg }
                ];
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-large',
                        messages: pollinationsMsgs,
                        seed: Math.floor(Math.random() * 9999),
                        private: true,
                    }),
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                reply = await res.text();
                // Pollinations czasem zwraca JSON, wyciągnij tekst
                try {
                    const j = JSON.parse(reply);
                    reply = j.choices?.[0]?.message?.content || j.content || reply;
                } catch {}
            }

            // Auto-nawigacja gdy AI sugeruje URL
            const navMatch = reply.match(/NAVIGATE:\s*(https?:\/\/\S+)/);
            if (navMatch) { navigate(navMatch[1]); setActivePanel('browser'); }

            setMessages(m => [...m, { role: 'assistant', content: reply.trim() }]);
        } catch (err) {
            setMessages(m => [...m, { role: 'assistant', content: `❌ Błąd AI: ${err.message}\n\nSpróbuj jeszcze raz lub sprawdź połączenie z internetem.` }]);
        } finally {
            setThinking(false);
        }

                                { label:'💊 Suplementy', msg:'Jakie suplementy są najlepiej udokumentowane naukowo dla optymalizacji mózgu?' },
                                { label:'😴 Sen i regeneracja', msg:'Jak zoptymalizować sen zgodnie z chronobiologią?' },
                                { label:'📊 Podsumuj stronę', msg:`Przeanalizuj i podsumuj zawartość strony: ${currentUrl}` },
                            ].map((c, i) => (
                                <button key={i} className="ai-quick-chip" onClick={() => setUserInput(c.msg)}>{c.label}</button>
                            ))}
                        </div>

                        {/* Input */}
                        <div style={{ padding:'12px 16px', borderTop:'1px solid rgba(255,255,255,0.07)' }}>
                            <div style={{ display:'flex', justifyContent:'center', marginBottom:6 }}>
                                <span style={{ fontSize:11, padding:'3px 10px', borderRadius:20, background: geminiKey ? 'rgba(52,211,153,0.1)' : 'rgba(102,126,234,0.1)', color: geminiKey ? '#34d399' : '#a78bfa', border: `1px solid ${geminiKey ? 'rgba(52,211,153,0.25)' : 'rgba(102,126,234,0.25)'}` }}>
                                    {geminiKey ? '✦ Gemini AI' : '✦ Pollinations AI (bezpłatny)'}
                                </span>
                            </div>
                            <div style={{ display:'flex', gap:'10px', alignItems:'flex-end', background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:'14px', padding:'10px 12px' }}>
                                <textarea
                                    value={userInput}
                                    onChange={e => setUserInput(e.target.value)}
                                    onKeyDown={handleChatKey}
                                    placeholder="Zadaj pytanie lub wydaj polecenie... (Enter = wyślij, Shift+Enter = nowa linia)"
                                    rows={1}
                                    style={{ flex:1, fontSize:'13px', resize:'none', background:'transparent', border:'none', color:'#e2e8f0', outline:'none', fontFamily:'inherit', lineHeight:1.5, maxHeight:'120px', overflowY:'auto' }}
                                />
                                <button
                                    className="btn-primary"
                                    onClick={sendAI}
                                    disabled={thinking || !userInput.trim()}
                                    style={{ padding:'8px 12px', borderRadius:'9px', border:'none', cursor:'pointer', color:'#fff', flexShrink:0, display:'flex', alignItems:'center' }}
                                >
                                    {I.send}
                                </button>
                            </div>
                            <p style={{ fontSize:10, color:'#374151', textAlign:'center', marginTop:6 }}>
                                {geminiKey ? 'Powered by Google Gemini' : 'Powered by Pollinations.ai · Bezpłatny · Bez rejestracji'}
                            </p>
                        </div>
                    </div>
                )}
            </div>

            {/* ══ Settings Modal ══ */}
            {showSettings && (
                <div className="modal-overlay">
                    <div className="fade-in" style={{ background:'#16162a', border:'1px solid rgba(102,126,234,0.25)', borderRadius:'20px', padding:'36px', width:'100%', maxWidth:'480px', boxShadow:'0 30px 80px rgba(0,0,0,0.6)' }}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'28px' }}>
                            <h2 style={{ fontSize:'1.2rem', fontWeight:700, color:'#fff' }}>⚙️ Ustawienia</h2>
                            <button onClick={() => setShowSettings(false)} style={{ background:'rgba(255,255,255,0.06)', border:'none', cursor:'pointer', color:'#9ca3af', padding:'6px', borderRadius:8, display:'flex' }}>{I.close}</button>
                        </div>

                        <div style={{ display:'flex', flexDirection:'column', gap:'22px' }}>

                            {/* Status AI */}
                            <div style={{ padding:'12px 14px', borderRadius:10, background: geminiKey ? 'rgba(52,211,153,0.07)' : 'rgba(102,126,234,0.07)', border: `1px solid ${geminiKey ? 'rgba(52,211,153,0.2)' : 'rgba(102,126,234,0.2)'}` }}>
                                <p style={{ fontSize:13, fontWeight:600, color: geminiKey ? '#34d399' : '#a78bfa', marginBottom:4 }}>
                                    {geminiKey ? '✅ Gemini AI aktywny' : '✅ AI działa — Pollinations (bez klucza)'}
                                </p>
                                <p style={{ fontSize:11, color:'#6b7280' }}>
                                    {geminiKey ? 'Używasz Google Gemini 1.5 Flash.' : 'AI działa natychmiast, bez żadnej konfiguracji. Opcjonalnie możesz dodać klucz Gemini poniżej dla lepszej jakości.'}
                                </p>
                            </div>

                            {/* Gemini key — opcjonalny */}
                            <div>
                                <label style={{ display:'flex', alignItems:'center', gap:6, fontSize:13, fontWeight:500, color:'#d1d5db', marginBottom:8 }}>
                                    {I.key} Klucz Gemini API <span style={{ color:'#6b7280', fontSize:11 }}>(opcjonalny — lepsza jakość)</span>
                                </label>
                                <input
                                    type="password"
                                    value={geminiKey}
                                    onChange={e => setGeminiKey(e.target.value)}
                                    className="form-input"
                                    placeholder="AIzaSy... (zostaw puste — AI działa bez klucza)"
                                />
                                <p style={{ fontSize:11, color:'#4b5563', marginTop:5 }}>
                                    Bezpłatny klucz: <span style={{ color:'#667eea' }}>aistudio.google.com/app/apikey</span>
                                </p>
                            </div>

                            {/* Google Client ID */}
                            <div>
                                <label style={{ display:'block', fontSize:13, fontWeight:500, color:'#d1d5db', marginBottom:8 }}>
                                    🔑 Google Client ID (dla Google Sign-In)
                                </label>
                                <input
                                    value={googleClientId}
                                    onChange={e => setGoogleClientId(e.target.value)}
                                    className="form-input"
                                    placeholder="123456789-abc.apps.googleusercontent.com"
                                />
                                <p style={{ fontSize:11, color:'#4b5563', marginTop:5 }}>
                                    Utwórz: console.cloud.google.com → APIs & Services → Credentials → OAuth 2.0
                                </p>
                            </div>

                            {/* Current user */}
                            <div style={{ padding:'14px', borderRadius:12, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)' }}>
                                <p style={{ fontSize:12, color:'#6b7280', marginBottom:8 }}>Zalogowany jako:</p>
                                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                                    {user?.picture
                                        ? <img src={user.picture} alt="" style={{ width:36, height:36, borderRadius:'50%', objectFit:'cover' }} />
                                        : <div style={{ width:36, height:36, borderRadius:'50%', background:'linear-gradient(135deg,#667eea,#764ba2)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, color:'#fff' }}>{user?.name?.[0]?.toUpperCase()}</div>
                                    }
                                    <div>
                                        <p style={{ fontWeight:600, color:'#fff', fontSize:14 }}>{user?.name}</p>
                                        <p style={{ fontSize:12, color:'#6b7280' }}>{user?.email}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Actions */}
                            <div style={{ display:'flex', gap:10 }}>
                                <button className="btn-primary" onClick={saveSettings} style={{ flex:1, padding:'12px', borderRadius:'11px', border:'none', cursor:'pointer', color:'#fff', fontWeight:600, fontSize:14 }}>
                                    Zapisz ustawienia
                                </button>
                                <button onClick={clearData} style={{ padding:'12px 16px', borderRadius:'11px', border:'1px solid rgba(255,255,255,0.12)', background:'none', cursor:'pointer', color:'#9ca3af', fontSize:13, transition:'color 0.15s' }}
                                    onMouseEnter={e => e.currentTarget.style.color='#ef4444'} onMouseLeave={e => e.currentTarget.style.color='#9ca3af'}>
                                    Reset danych
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

ReactDOM.render(<OpenHumanAgent />, document.getElementById('root'));
</script>
</body>
</html>

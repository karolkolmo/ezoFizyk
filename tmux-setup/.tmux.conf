# ~/.tmux.conf — Konfiguracja tmux dla Karola
# Skopiuj ten plik do: C:\Users\TwojaNazwa\.tmux.conf (przez WSL: ~/.tmux.conf)

# ── Zmień prefix z Ctrl+B na Ctrl+A (łatwiejszy) ──
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Mysz działa (scrollowanie, klikanie) ──
set -g mouse on

# ── Numerowanie okien od 1 ──
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ── Większa historia ──
set -g history-limit 50000

# ── Kolory ──
set -g default-terminal "screen-256color"

# ── Pasek statusu — ciemny, czytelny ──
set -g status-style bg='#1a1a2e',fg='#a78bfa'
set -g status-left '#[fg=#667eea,bold] 🤖 #S '
set -g status-right '#[fg=#6b7280] %H:%M  %d.%m.%Y '
set -g status-left-length 30
set -g window-status-current-style bg='#667eea',fg='#ffffff',bold
set -g window-status-current-format ' #I:#W '
set -g window-status-format ' #I:#W '

# ── Dzielenie paneli skrótami v i h ──
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# ── Nawigacja między panelami strzałkami ──
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Przeładowanie konfiguracji ──
bind r source-file ~/.tmux.conf \; display "✅ Konfiguracja przeładowana!"

# ── Kopiowanie jak w Vi ──
set-window-option -g mode-keys vi
